name: SkillForge MERN CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - changes
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Lint & Syntax Validation
  # ============================================================================
  lint-and-validate:
    name: 🔍 Lint & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci || npm install

      - name: 🛡️ Syntax Check Backend Files
        run: |
          node --check server/server.js
          node --check server/config/db.js
          echo "✅ Backend syntax validation passed."

      - name: 🧹 Run ESLint
        run: |
          npm run lint || echo "⚠️ Lint warnings detected (non-blocking in early stage)"

  # ============================================================================
  # Stage 2: Build Verification (React Frontend & Assets)
  # ============================================================================
  build-application:
    name: 🏗️ Build Frontend & Production Assets
    runs-on: ubuntu-latest
    needs: [lint-and-validate]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci || npm install

      - name: 🚀 Build Frontend Bundle (Vite)
        run: |
          npm run build
        env:
          VITE_API_URL: http://localhost:3001

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # Stage 3: Docker Build Verification (MERN Stack Containerization)
  # ============================================================================
  docker-build-verify:
    name: 🐳 Docker Container Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [build-application]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: 🐳 Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: skillforge-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build Frontend Docker Image (Nginx Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: skillforge-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build Root Dockerfile (Single-container Backend/PaaS)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: skillforge-root:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 4: Continuous Deployment (CD / Release Readiness)
  # ============================================================================
  deploy:
    name: 🚀 Continuous Deployment
    runs-on: ubuntu-latest
    needs: [docker-build-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🚀 Deployment Pipeline Notification
        run: |
          echo "========================================================"
          echo "🎉 All CI checks passed!"
          echo "🚀 Deploying to Production environment for commit ${{ github.sha }}..."
          echo "Branch: ${{ github.ref }}"
          echo "========================================================"

      # Optional Docker Hub / GHCR registry push or webhook triggers can be attached here
      - name: 📋 Ready for Container / Cloud Provider Deployment
        run: |
          echo "Container images are validated and ready for deployment to Cloud / Kubernetes / Render / AWS ECS."
