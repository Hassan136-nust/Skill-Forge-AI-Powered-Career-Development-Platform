<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle dark glow -->
    <radialGradient id="space-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Planet Sphere Gradient -->
    <radialGradient id="saturn-body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="95%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Glowing Cyan/Blue Ring Gradient -->
    <linearGradient id="ring-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="75%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Ring Shadow across Planet -->
    <linearGradient id="ring-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>

    <!-- Clip for Front Part of Ring -->
    <clipPath id="front-ring-clip">
      <rect x="0" y="32" width="64" height="32" />
    </clipPath>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#space-glow)" />

  <!-- Back of Ring (behind planet) -->
  <g transform="rotate(-26 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="7.5" fill="none" stroke="url(#ring-glow)" stroke-width="4.5" stroke-opacity="0.85" />
    <ellipse cx="32" cy="32" rx="23" ry="5.5" fill="none" stroke="#BAE6FD" stroke-width="1.2" stroke-opacity="0.6" />
  </g>

  <!-- Planet Body -->
  <circle cx="32" cy="32" r="16" fill="url(#saturn-body)" />

  <!-- Planet Atmospheric Bands -->
  <g clip-path="url(#planet-clip)">
    <clipPath id="planet-clip">
      <circle cx="32" cy="32" r="16" />
    </clipPath>
    <path d="M16 28 Q 32 35 48 28 L 48 31 Q 32 38 16 31 Z" fill="#D97706" opacity="0.35" />
    <path d="M16 24 Q 32 31 48 24 L 48 26 Q 32 33 16 26 Z" fill="#FDE68A" opacity="0.4" />
    <path d="M16 34 Q 32 41 48 34 L 48 37 Q 32 44 16 37 Z" fill="#B45309" opacity="0.45" />
    <!-- Planet Shadow (Crescent night side) -->
    <path d="M32 16 A 16 16 0 0 1 48 32 A 16 16 0 0 1 32 48 Q 42 32 32 16 Z" fill="#000000" opacity="0.45" />
  </g>

  <!-- Front of Ring (in front of planet) -->
  <g transform="rotate(-26 32 32)">
    <!-- Shadow cast by ring onto planet -->
    <path d="M16 31.5 Q 32 34.5 48 31.5 Q 32 33.5 16 31.5 Z" fill="#000" opacity="0.4" />
    
    <!-- Outer bright glowing cyan ring -->
    <path d="M5 32 A 27 7.5 0 0 0 59 32" fill="none" stroke="url(#ring-glow)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Inner bright rim -->
    <path d="M9 32 A 23 5.5 0 0 0 55 32" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
  </g>

  <!-- Tiny Cosmic Star Sparkle -->
  <circle cx="53" cy="14" r="1.2" fill="#FFD166" opacity="0.9" />
  <circle cx="12" cy="48" r="0.9" fill="#38BDF8" opacity="0.8" />
</svg>